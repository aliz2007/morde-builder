name: companion-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'companion-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: mac
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      - name: Build installers
        run: npx electron-builder --publish never

      - name: Zip the portable exe for one-click download
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem "dist/*.exe" | Where-Object { $_.Name -notmatch 'Setup' } | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "dist/Mordekaiser-Bible-Companion-$v-windows.zip"
          Get-Item "dist/Mordekaiser-Bible-Companion-$v-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.artifact }}
          path: |
            companion/dist/*.exe
            companion/dist/*.zip
            companion/dist/*.dmg
            companion/dist/*.AppImage
            companion/dist/latest*.yml
            companion/dist/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Mordekaiser Bible Companion.

            - **Windows (easiest)**: `Mordekaiser-Bible-Companion-*-windows.zip` —
              download, extract, double-click the `.exe` inside. No install, no terminal.
              Or use `Setup *.exe` for a proper installer with a Start Menu entry.
            - **macOS**: `.dmg` — unsigned, so right-click the app → Open the first time
            - **Linux**: `.AppImage` — `chmod +x` and run

            The app updates itself after this — you'll never download it again
            (macOS excepted: unsigned apps can't self-update there).

            Start it, then start League. The picker appears at champ select.
