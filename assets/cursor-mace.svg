<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38">
  <!-- Mordekaiser's mace, mirrored so the head leads at the top-left.
       Hotspot is the outermost spike at (2,2). -->
  <g stroke-linejoin="round">
    <!-- ambient bloom behind the head -->
    <circle cx="11" cy="10" r="9" fill="#34E0CE" opacity=".16"/>
    <circle cx="11" cy="10" r="5.5" fill="#34E0CE" opacity=".18"/>

    <!-- shaft -->
    <path d="M15.5 15.5 L31 31" stroke="#050908" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M15.5 15.5 L31 31" stroke="#222c29" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M16.5 15 L30 28.5" stroke="#46534f" stroke-width="1" stroke-linecap="round" opacity=".85"/>

    <!-- pommel -->
    <path d="M30 27.5 L36.5 34 L33.5 37 L27 30.5 Z" fill="#131b19" stroke="#46534f" stroke-width="1.1"/>
    <path d="M31 30 L33.5 32.5" stroke="#34E0CE" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>

    <!-- outer spikes -->
    <path d="M10.5 2.5 L16.5 0.5 L18 7 Z" fill="#18211f" stroke="#46534f" stroke-width="1"/>
    <path d="M19 13.5 L23.5 18 L14 19.5 Z" fill="#18211f" stroke="#46534f" stroke-width="1"/>
    <path d="M2 10.5 L0.5 16 L7.5 17.5 Z" fill="#18211f" stroke="#46534f" stroke-width="1"/>

    <!-- head block, tip at 2,2 -->
    <path d="M2 2 L11 3 L17.5 8 L19 14.5 L13 19 L6 17 L2.5 11 Z"
          fill="#0f1716" stroke="#55645f" stroke-width="1.3"/>

    <!-- the crack that glows -->
    <path d="M6.5 8 L12 6.6 L14.5 12.2 L9 14.2 Z" fill="#0F6B62"/>
    <path d="M7.6 8.7 L11.4 7.7 L13.3 11.8 L9.6 13.1 Z" fill="#34E0CE"/>
    <path d="M9 9.6 L11.2 9 L12.2 11.3 L10 12 Z" fill="#A8FFF4"/>
  </g>
</svg>
