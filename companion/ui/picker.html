<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mordekaiser Bible</title>
<link rel="stylesheet" href="shared.css">
<style>
  body{
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
    border:1px solid var(--line);
    background:
      radial-gradient(130% 55% at 50% -14%, rgba(52,224,206,.15), transparent 62%),
      var(--bg);
  }
  #titlebar{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:10px; padding:11px 10px 9px 15px;
    background:linear-gradient(180deg, rgba(26,36,35,.95), rgba(16,22,21,.6));
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(52,224,206,.14);
    -webkit-app-region:drag;
  }
  #titlebar .crown{
    width:36px; height:23px; color:var(--text);
    filter:drop-shadow(0 0 9px rgba(52,224,206,.55));
    animation:flicker 9s linear infinite;
  }
  h1{
    font:700 14px/1 var(--display); text-transform:uppercase; letter-spacing:.09em;
    margin:0; white-space:nowrap;
  }
  #status{ margin-left:auto; display:flex; align-items:center; gap:7px;
    font:11px/1 var(--mono); color:var(--faint); white-space:nowrap; }
  #dot{ width:7px; height:7px; border-radius:50%; background:var(--faint); }
  #status.on{ color:var(--glow); text-shadow:0 0 10px rgba(52,224,206,.45); }
  #status.on #dot{
    background:var(--glow);
    box-shadow:0 0 8px 2px rgba(52,224,206,.5);
    animation:breathe 2.6s ease-in-out infinite;
  }
  .winbtn{
    -webkit-app-region:no-drag;
    width:26px; height:22px; padding:0; display:grid; place-items:center;
    font:600 12px/1 var(--mono); text-transform:none; background:transparent; border-color:transparent;
    color:var(--muted);
  }
  .winbtn:hover{ border-color:var(--line); color:var(--text); box-shadow:none; }
  #close:hover{ color:var(--bad); border-color:var(--bad); }

  main{ position:relative; z-index:1; flex:1; overflow-y:auto; padding:4px 16px 16px; }
  .hint{ color:var(--faint); font-size:12px; margin:4px 0 10px; }
  #enemies{ display:grid; gap:7px; margin:0 0 6px; }
  .enemy{
    position:relative; overflow:hidden;
    display:grid; grid-template-columns:40px 1fr auto; gap:11px; align-items:center;
    text-align:left; padding:8px 11px; text-transform:none; letter-spacing:0;
    font:600 13px var(--sans); border-left:2px solid var(--line);
    background:linear-gradient(180deg, var(--raised), rgba(16,22,21,.9));
    transition:transform .16s, border-color .16s, box-shadow .16s;
  }
  .enemy:hover{ border-left-color:var(--glow); transform:translateX(3px);
    box-shadow:0 0 14px rgba(52,224,206,.15); }
  .enemy img{ width:40px; height:40px; border-radius:2px; border:1px solid var(--edge); }
  .enemy .no-img{ width:40px; height:40px; border-radius:2px; border:1px solid var(--line);
    display:grid; place-items:center; color:var(--faint); font:600 15px var(--mono); }
  .enemy.picked{
    border-color:var(--glow-lo); border-left-color:var(--glow);
    animation:aura-pulse 2.8s ease-in-out infinite;
  }
  .enemy.picked img{ border-color:var(--glow-lo);
    box-shadow:0 0 12px rgba(52,224,206,.4); }
  .enemy .sub{ display:block; color:var(--faint); font:400 11px var(--sans); }
  .empty{
    position:relative; color:var(--faint); border:1px dashed var(--line); border-radius:2px;
    padding:26px 12px; text-align:center; overflow:hidden;
  }
  .empty .crown{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-52%);
    width:120px; height:75px; color:var(--panel); opacity:.9; z-index:-1;
  }
  #toggles{
    display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin:0 0 6px;
    padding:12px; background:rgba(16,22,21,.82); border:1px solid var(--line); border-radius:2px;
  }
  #toggles label{ display:flex; gap:8px; align-items:center;
    font:500 12px var(--chrome); text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); cursor:pointer; }
  #toggles label:hover{ color:var(--text); }
  #toggles input{ accent-color:var(--glow); }
  #log{
    font:11px/1.65 var(--mono); background:rgba(16,22,21,.82); border:1px solid var(--line);
    border-radius:2px; padding:8px 10px; height:118px; overflow-y:auto;
  }
  #log div{ animation:card-arrive .25s ease-out both; }
  #log .ok{ color:var(--ok); } #log .warn{ color:var(--warn); }
  #log .error{ color:var(--bad); } #log .info{ color:var(--muted); }
</style>
</head>
<body>
<div class="mist-layer a" aria-hidden="true"></div>
<div class="mist-layer b" aria-hidden="true"></div>
<div class="souls" id="souls" aria-hidden="true"></div>

<div id="titlebar">
  <svg class="crown" viewBox="0 0 64 40" aria-hidden="true"><path fill-rule="evenodd" d="M2 40 L2 22 L9 30 L14 8 L21 24 L27 2 L32 0 L37 2 L43 24 L50 8 L55 30 L62 22 L62 40 Z M14 31 L50 31 L50 35 L14 35 Z"/></svg>
  <h1 class="engraved">Mordekaiser Bible</h1>
  <span id="status"><i id="dot"></i><span id="statusText">waiting for client…</span></span>
  <button class="winbtn" id="minimize" title="Minimize">–</button>
  <button class="winbtn" id="close" title="Hide to tray">×</button>
</div>

<main>
  <hr class="seam live" style="margin-top:10px">
  <p class="eyebrow">Enemy team</p>
  <p class="hint">Pick whoever you think is their top laner. Runes go straight to the client.</p>
  <div id="enemies"></div>

  <hr class="seam">
  <p class="eyebrow">On pick</p>
  <div id="toggles">
    <label><input type="checkbox" data-toggle="runes"> Push runes</label>
    <label><input type="checkbox" data-toggle="items"> Save item set</label>
    <label><input type="checkbox" data-toggle="summoners"> Set summoners</label>
    <label><input type="checkbox" data-toggle="overlay"> Show overlay</label>
  </div>

  <hr class="seam">
  <p class="eyebrow">Log</p>
  <div id="log"></div>
</main>

<script src="picker.js"></script>
</body>
</html>
