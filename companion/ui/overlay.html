<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MB Overlay</title>
<link rel="stylesheet" href="shared.css">
<style>
  html,body{ background:transparent; height:100%; }
  #wrap{ position:fixed; inset:0; padding:6px; box-sizing:border-box; }
  #card{
    position:relative; width:100%; height:100%; box-sizing:border-box;
    display:flex; flex-direction:column;
    background:rgba(8,11,11,.93);
    border:1px solid var(--line); border-radius:3px; overflow:hidden;
    box-shadow:0 6px 30px rgba(0,0,0,.55);
  }
  #aura{
    position:absolute; inset:0; border-radius:4px; pointer-events:none; z-index:0;
    box-shadow:0 0 22px rgba(52,224,206,.28), inset 0 0 1px rgba(52,224,206,.4);
    opacity:.8;
  }
  /* brief pulse when a new matchup arrives — NOT an infinite animation:
     an endless one repaints the window 60x/s forever and burns CPU idle */
  #aura.pulse{ animation:breathe 1.6s ease-in-out 2; }
  #card.arrive{ animation:card-arrive .3s cubic-bezier(.2,.8,.3,1) both; }
  #flash{
    position:absolute; left:50%; top:40%; width:150px; height:150px;
    border:2px solid var(--glow); border-radius:50%; pointer-events:none; opacity:0;
    box-shadow:0 0 30px rgba(52,224,206,.55), inset 0 0 22px rgba(52,224,206,.35);
    z-index:3;
  }
  #flash.go{ animation:ring-burst .7s cubic-bezier(.2,.8,.3,1) both; }
  @media (prefers-reduced-motion: reduce){
    #aura.pulse{ animation:none; }
    #card.arrive{ animation:none; }
    #flash{ display:none; }
  }
  #bar{
    display:flex; align-items:center; gap:8px; padding:7px 10px;
    background:linear-gradient(180deg, #1A2423, var(--panel));
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(52,224,206,.15);
    -webkit-app-region:drag;
    flex:0 0 auto;
  }
  #bar img{ width:26px; height:26px; border-radius:2px; border:1px solid var(--edge); }
  #bar .name{
    font:700 13px/1 var(--display); text-transform:uppercase; letter-spacing:.08em;
    text-shadow:0 1px 0 rgba(0,0,0,.9);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #bar .pill{ margin-left:auto; }
  #bar button{ -webkit-app-region:no-drag; padding:4px 7px; font-size:10px; }
  #body{ padding:10px 12px 12px; flex:1 1 auto; min-height:0; overflow-y:auto; }
  section{ margin:0 0 12px; }
  .cond{ font:600 11px/1.3 var(--chrome); text-transform:uppercase; letter-spacing:.12em;
    color:var(--brass); margin:0 0 5px; }
  .strip{ display:flex; gap:4px; margin:0 0 6px; flex-wrap:wrap; }
  .strip img{ width:30px; height:30px; border-radius:2px; border:1px solid var(--edge); }
  ol{ margin:0; padding:0; list-style:none; counter-reset:n; }
  ol li{ position:relative; padding-left:22px; margin:0 0 5px; font-size:12px; }
  ol li::before{ counter-increment:n; content:counter(n,decimal-leading-zero);
    position:absolute; left:0; top:1px; font:600 10px var(--mono); color:var(--glow-lo); }
  ol .item{ font-weight:600; }
  ol .note{ color:var(--muted); }
  ul{ margin:0; padding:0; list-style:none; }
  ul li{ position:relative; padding-left:14px; margin:0 0 6px; font-size:12px; color:var(--muted); }
  ul li::before{ content:""; position:absolute; left:0; top:9px; width:8px; height:1px; background:var(--glow-lo); }
  .summs{ display:flex; gap:8px; font:600 12px var(--mono); color:var(--glow); }
  #more{ width:100%; }
  .pick{ margin:0 0 9px; }
  .pick .item{ display:block; font-weight:600; font-size:12px; }
  .pick .note{ display:block; color:var(--muted); font-size:11px; line-height:1.35; }
  .hintline{ color:var(--muted); font-size:12px; margin:0 0 6px; }
  .hintline b{ color:var(--text); }
  .warnline{ color:var(--warn); }
  .hidden{ display:none; }
  #empty{ padding:20px 14px; color:var(--faint); text-align:center; }

  /* section selector in the title bar */
  #focus{
    -webkit-app-region:no-drag; margin-left:auto; max-width:120px;
    background:var(--panel); color:var(--glow); border:1px solid var(--edge);
    border-radius:2px; font:600 10px var(--chrome); text-transform:uppercase;
    letter-spacing:.06em; padding:3px 4px; cursor:pointer;
  }
  #bar .pill{ margin-left:0; }

  /* resize handles: invisible strips on every edge + corners.
     The SE/SW corners keep the diagonal stripes so resize is discoverable. */
  .rz{ position:absolute; z-index:5; -webkit-app-region:no-drag; touch-action:none; }
  .rz[data-edge=n]{ top:0; left:14px; right:14px; height:9px; cursor:ns-resize; }
  .rz[data-edge=s]{ bottom:0; left:14px; right:14px; height:9px; cursor:ns-resize; }
  .rz[data-edge=e]{ right:0; top:14px; bottom:14px; width:9px; cursor:ew-resize; }
  .rz[data-edge=w]{ left:0; top:14px; bottom:14px; width:9px; cursor:ew-resize; }
  .rz[data-edge=ne]{ top:0; right:0; width:16px; height:16px; cursor:nesw-resize; }
  .rz[data-edge=sw]{ bottom:0; left:0; width:16px; height:16px; cursor:nesw-resize; }
  .rz[data-edge=nw]{ top:0; left:0; width:16px; height:16px; cursor:nwse-resize; }
  .rz[data-edge=se]{ bottom:0; right:0; width:16px; height:16px; cursor:nwse-resize; }
  .rz[data-edge=se], .rz[data-edge=sw]{
    background:
      linear-gradient(135deg, transparent 0 42%, var(--glow-lo) 42% 52%, transparent 52% 62%, var(--glow-lo) 62% 72%, transparent 72% 82%, var(--glow-lo) 82% 92%, transparent 92%);
  }
  .rz[data-edge=sw]{ transform:scaleX(-1); }
  .rz[data-edge=se]:hover, .rz[data-edge=sw]:hover{ filter:brightness(1.8); }
</style>
</head>
<body>
<div id="wrap">
<span id="aura" aria-hidden="true"></span>
<span id="flash" aria-hidden="true"></span>
<div id="card">
  <div id="bar">
    <img id="portrait" alt="" class="hidden">
    <span class="name" id="champ">—</span>
    <span class="pill" id="diff"></span>
    <select id="focus" title="What this card shows">
      <option value="all">Everything</option>
      <option value="tldr">TL;DR</option>
      <option value="early">Early game</option>
      <option value="trade">How to trade</option>
      <option value="watch">Watch out for</option>
      <option value="tips">Tips</option>
      <option value="builds">Items</option>
      <option value="summoners">Summoners</option>
      <option value="live">Next items (live)</option>
    </select>
    <button id="pin" title="Click-through on/off">pin</button>
    <button id="hide" title="Hide (Ctrl/Cmd+Shift+M)">hide</button>
  </div>
  <div id="body">
    <div id="empty">Pick an enemy in champ select and the plan shows up here.</div>
    <div id="content" class="hidden">
      <section id="summsWrap">
        <p class="eyebrow">Summoners</p>
        <div class="summs" id="summs"></div>
      </section>
      <div id="builds"></div>
      <div id="tipsWrap"></div>
      <section id="liveWrap" class="hidden">
        <p class="eyebrow">Next items — live</p>
        <div id="live"></div>
      </section>
      <button id="more">show everything</button>
    </div>
  </div>
</div>
<span class="rz" data-edge="n"></span>
<span class="rz" data-edge="s"></span>
<span class="rz" data-edge="e"></span>
<span class="rz" data-edge="w"></span>
<span class="rz" data-edge="ne"></span>
<span class="rz" data-edge="nw"></span>
<span class="rz" data-edge="se" title="Drag to resize"></span>
<span class="rz" data-edge="sw" title="Drag to resize"></span>
</div>
<script src="overlay.js"></script>
</body>
</html>
